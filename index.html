<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24443b"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>문장과 사유</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#243b33;background:#f6f3eb}*{box-sizing:border-box}body{margin:0}header{background:#24443b;color:white;padding:32px 20px 22px}header small{color:#d9c69a;letter-spacing:2px}h1{margin:8px 0;font-size:30px}header p{margin:0;color:#e1e9e4}nav{display:flex;overflow:auto;background:#e9e6dd;padding:10px;gap:8px;position:sticky;top:0;z-index:2}button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 15px;background:#24443b;color:white;cursor:pointer}nav button{white-space:nowrap;background:white;color:#24443b}nav button.active{background:#24443b;color:white}main{max-width:950px;margin:22px auto;padding:0 16px 80px}.panel{background:white;border:1px solid #e3dfd4;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #243b330a}h2{font-size:23px}h3{font-size:18px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;border:1px solid #c8c8bd;border-radius:9px;padding:12px;font:inherit;background:#fff}textarea{min-height:95px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.book{border-radius:12px;background:#f3efe4;padding:15px;border-left:7px solid #9e805c;cursor:pointer}.muted{color:#65756d;font-size:14px}.progress{height:8px;background:#ddd;border-radius:6px;overflow:hidden}.progress span{display:block;background:#56836d;height:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:14px}.note{border-left:3px solid #b79b69;padding:10px 14px;background:#f8f6f0;margin:10px 0;white-space:pre-wrap}iframe{width:100%;height:65vh;border:1px solid #ddd;border-radius:10px}section[hidden]{display:none}.stat{font-size:26px;font-weight:700}.secondary{background:#e9e6dd;color:#24443b}@media(max-width:600px){header{padding-top:25px}h1{font-size:26px}.panel{padding:15px}iframe{height:60vh}}</style></head><body>
<header><small>READ · THINK · WRITE</small><h1>문장과 사유</h1><p>읽고, 생각하고, 쓰고, 다시 쓰다.</p></header>
<nav id="nav"><button data-tab="home" class="active">오늘의 연구실</button><button data-tab="library">나의 서재</button><button data-tab="pdf">PDF 독서실</button><button data-tab="notes">독서 노트</button><button data-tab="writing">글쓰기</button><button data-tab="sermon">설교 연구</button><button data-tab="backup">백업·복원</button></nav><main id="app"><div class="panel"><h2>오늘의 연구실</h2><p>앱을 불러오는 중입니다.</p></div></main>
<script>
(()=>{'use strict';const KEY='thought-writing-v01';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{db={}};db.books=Array.isArray(db.books)?db.books:[];db.readingNotes=Array.isArray(db.readingNotes)?db.readingNotes:[];db.drafts=Array.isArray(db.drafts)?db.drafts:[];db.sermons=Array.isArray(db.sermons)?db.sermons:[];let tab='home',pdfUrl=null,pdfPage=1;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),date=()=>new Date().toLocaleDateString('ko-KR');function options(){return db.books.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.title)+'</option>').join('')}function show(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function render(){let h='';if(tab==='home'){h='<h2>오늘의 연구실</h2><div class="grid"><div class="panel"><div class="stat">'+db.books.length+'</div>등록한 책</div><div class="panel"><div class="stat">'+db.readingNotes.length+'</div>독서 메모</div><div class="panel"><div class="stat">'+db.drafts.length+'</div>글쓰기 기록</div></div><div class="panel"><h3>오늘의 작은 실천</h3><p>책을 10분 읽고 마음에 남은 생각을 한 문장 적어 보세요.</p><button data-go="library">책장 열기</button></div>'}
if(tab==='library'){h='<h2>나의 서재</h2><div class="grid">'+db.books.map(b=>'<div class="book" data-book="'+esc(b.id)+'"><strong>'+esc(b.title)+'</strong><p class="muted">'+esc(b.author)+'</p><div class="progress"><span style="width:'+Math.max(0,Math.min(100,Number(b.progress)||0))+'%"></span></div><p class="muted">'+(Number(b.progress)||0)+'% 읽음 · '+esc(b.owned||'등록')+'</p><div class="actions"><button data-selectbook="'+esc(b.id)+'">독서 기록</button><button class="secondary" data-removebook="'+esc(b.id)+'">삭제</button></div></div>').join('')+'</div><div class="panel"><h3>책 등록</h3><form id="bookform"><label>책 제목</label><input name="title" required maxlength="180"><label>저자</label><input name="author" maxlength="120"><label>총 페이지</label><input name="total" type="number" min="1"><label>보유 상태</label><select name="owned"><option>구매 완료</option><option>구매 예정</option><option>대여</option><option>전자책</option></select><div class="actions"><button>책장에 등록</button></div></form></div>'}
if(tab==='pdf'){h='<h2>PDF 독서실</h2><div class="panel"><p class="muted">기기에서 선택한 PDF는 서버로 전송되지 않습니다. 브라우저의 PDF 표시 기능을 사용합니다.</p><label>내 PDF 열기</label><input id="pdffile" type="file" accept=".pdf,application/pdf"><div class="actions"><button id="pdfprev">이전 쪽</button><input id="pdfpage" type="number" min="1" value="'+pdfPage+'" style="width:95px"><button id="pdfnext">다음 쪽</button><button class="secondary" id="pdfclose">닫기</button></div>'+(pdfUrl?'<iframe id="pdfview" title="PDF 독서" src="'+esc(pdfUrl)+'#page='+pdfPage+'"></iframe>':'<p class="muted">PDF 파일을 선택하면 여기에 표시됩니다. iPad Safari에서는 PDF 페이지 이동이 제한될 수 있습니다.</p>')+'</div>'}
if(tab==='notes'){h='<h2>독서 노트</h2><div class="panel"><form id="noteform"><label>책 선택</label><select name="bookId" required>'+options()+'</select><label>메모 유형</label><select name="type"><option>감상</option><option>좋은 문장</option><option>질문</option><option>아이디어</option></select><label>페이지</label><input name="page" type="number" min="1"><label>메모</label><textarea name="text" required placeholder="읽는 중 떠오른 생각을 기록하세요"></textarea><button>메모 저장</button></form></div><h3>저장한 메모</h3>'+db.readingNotes.map(n=>'<div class="note"><strong>'+esc(db.books.find(b=>b.id===n.bookId)?.title||'기타')+' · '+esc(n.type||'메모')+'</strong><span class="muted"> '+esc(n.page||'')+'쪽</span><p>'+esc(n.text)+'</p></div>').join('')}
if(tab==='writing'){h='<h2>글쓰기 작업실</h2><div class="panel"><form id="draftform"><label>글 제목</label><input name="title" required><label>초고 · 생각</label><textarea name="text" required></textarea><button>글 저장</button></form></div>'+db.drafts.map(d=>'<div class="panel"><h3>'+esc(d.title)+'</h3><p class="muted">'+esc(d.created||'')+'</p><p style="white-space:pre-wrap">'+esc(d.text)+'</p></div>').join('')}
if(tab==='sermon'){h='<h2>설교문 연구실</h2><div class="panel"><p class="muted">귀납적 본문 관찰과 해석을 먼저 기록합니다.</p><form id="sermonform"><label>본문</label><input name="passage" required placeholder="예: 에베소서 2:1–10"><label>본문에서 관찰한 사실</label><textarea name="observation" required></textarea><label>문맥과 핵심 메시지</label><textarea name="interpretation"></textarea><label>본문에 나타난 하나님</label><textarea name="god"></textarea><button>연구 기록 저장</button></form></div>'+db.sermons.map(s=>'<div class="panel"><h3>'+esc(s.passage)+'</h3><p><strong>관찰</strong></p><p>'+esc(s.observation)+'</p><p><strong>해석</strong></p><p>'+esc(s.interpretation)+'</p><p><strong>하나님</strong></p><p>'+esc(s.god)+'</p></div>').join('')}
if(tab==='backup'){h='<h2>백업과 복원</h2><div class="panel"><p>독서 기록은 이 브라우저에만 저장됩니다. 정기적으로 백업하세요. PDF 원본은 백업에 포함되지 않습니다.</p><button id="export">JSON 백업 다운로드</button><label>백업 파일 복원</label><input id="import" type="file" accept=".json"></div>'}$('#app').innerHTML=h;wire()}
function wire(){const form=(selector,fn)=>{let f=$(selector);if(f)f.addEventListener('submit',e=>{e.preventDefault();fn(new FormData(f));save();render()})};form('#bookform',f=>db.books.push({id:id(),title:f.get('title'),author:f.get('author'),total:Number(f.get('total'))||0,owned:f.get('owned'),progress:0}));form('#noteform',f=>{if(!f.get('bookId'))return alert('책을 먼저 등록하세요.');db.readingNotes.unshift({id:id(),bookId:f.get('bookId'),type:f.get('type'),page:f.get('page'),text:f.get('text'),created:date()})});form('#draftform',f=>db.drafts.unshift({id:id(),title:f.get('title'),text:f.get('text'),created:date()}));form('#sermonform',f=>db.sermons.unshift({id:id(),passage:f.get('passage'),observation:f.get('observation'),interpretation:f.get('interpretation'),god:f.get('god')}));document.querySelectorAll('[data-selectbook]').forEach(b=>b.onclick=()=>show('notes'));document.querySelectorAll('[data-removebook]').forEach(b=>b.onclick=()=>{if(confirm('책을 삭제할까요? 메모는 유지됩니다.')){db.books=db.books.filter(x=>x.id!==b.dataset.removebook);save();render()}});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));if($('#pdffile'))$('#pdffile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return alert('PDF만 열 수 있습니다.');if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(f);pdfPage=1;render()};const go=n=>{pdfPage=Math.max(1,Number(n)||1);$('#pdfpage').value=pdfPage;if($('#pdfview'))$('#pdfview').src=pdfUrl+'#page='+pdfPage};if($('#pdfprev')){$('#pdfprev').onclick=()=>go(pdfPage-1);$('#pdfnext').onclick=()=>go(pdfPage+1);$('#pdfpage').onchange=e=>go(e.target.value);$('#pdfclose').onclick=()=>{if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=null;render()}}if($('#export'))$('#export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='문장과_사유_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('#import'))$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v||!Array.isArray(v.books))throw Error('형식 오류');if(!confirm('현재 기록을 백업 파일로 교체할까요?'))return;db={...db,...v};save();render();alert('복원했습니다')}catch(err){alert('백업 파일을 확인해 주세요: '+err.message)}}}$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
